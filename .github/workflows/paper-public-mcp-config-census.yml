name: Paper Public MCP Config Census

on:
  push:
    branches:
      - codex/paper-recovery-deep
    paths:
      - '.github/workflows/paper-public-mcp-config-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    name: Public MCP config census
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public Paper Desktop MCP config
        shell: bash
        run: |
          set -euo pipefail
          url='https://app.paper.design/mcp/desktop/config.json'
          curl --fail --location --retry 3 --retry-delay 2 \
            --header 'Accept: application/json' \
            --output paper-mcp-config.json \
            "$url"
          python3 -m json.tool paper-mcp-config.json >/dev/null

      - name: Produce metadata-only census
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          source = Path('paper-mcp-config.json').read_bytes()
          data = json.loads(source)
          tools = data.get('tools') or []

          def canonical_hash(value):
              raw = json.dumps(value, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(raw).hexdigest()

          rows = []
          for tool in tools:
              if not isinstance(tool, dict):
                  continue
              rows.append({
                  'name': tool.get('name'),
                  'description_sha256': hashlib.sha256(str(tool.get('description', '')).encode()).hexdigest(),
                  'input_schema_sha256': canonical_hash(tool.get('inputSchema')),
                  'annotations': tool.get('annotations'),
              })

          output = {
              'source_url': 'https://app.paper.design/mcp/desktop/config.json',
              'response_sha256': hashlib.sha256(source).hexdigest(),
              'instructions_sha256': hashlib.sha256(str(data.get('instructions', '')).encode()).hexdigest(),
              'tool_count': len(rows),
              'tool_names': [row['name'] for row in rows],
              'tools': rows,
          }
          Path('paper-mcp-config-census.json').write_text(json.dumps(output, indent=2, sort_keys=True) + '\n')
          print(json.dumps(output, indent=2, sort_keys=True))

      - name: Remove raw response
        run: rm -f paper-mcp-config.json

      - name: Upload metadata-only census
        uses: actions/upload-artifact@v4
        with:
          name: paper-public-mcp-config-census
          path: paper-mcp-config-census.json
          if-no-files-found: error
          retention-days: 7
