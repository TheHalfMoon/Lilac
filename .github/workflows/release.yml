name: Release Evidence

# Builds the SBOM and attribution bundle and the desktop archives, collects them into one
# release set, and, for a release tag only, signs every file with keyless Sigstore
# attestations through GitHub OIDC (no stored signing key) and puts them in a draft GitHub
# Release. Pushing a tag is the release decision; this workflow never creates tags and never
# publishes the draft. A manual dispatch or a pull request builds and collects but never
# signs, so no attestation exists for anything but a tagged commit.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
  # A change to the release path shows the whole pipeline working on its exact head.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/desktop.yml
      - scripts/release-bundle.mjs
      - scripts/package-desktop.mjs
      - scripts/fetch-electron.mjs

permissions:
  contents: read

jobs:
  build:
    # Dependency and test code runs here, in a job that cannot mint OIDC tokens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # The full gate includes the desktop shell's tests, set up exactly as in CI.
      - name: Cache the pinned Electron archive
        uses: actions/cache@v4
        with:
          path: .lilac-cache/electron/downloads
          key: electron-${{ runner.os }}-${{ hashFiles('scripts/desktop/electron.mjs') }}
      - name: Fetch the pinned Electron runtime (SHA-256 verified)
        run: node scripts/fetch-electron.mjs
      - name: Allow Chromium's sandbox (unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee check.log
      - name: Annotate test totals
        if: always()
        shell: bash
        run: |
          # Check-run annotations readable through the REST API.
          totals=$(grep -E '^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$' check.log 2>/dev/null | sed 's/^# //' | paste -sd ' ' - || true)
          echo "::notice title=Test totals::head=${{ github.event.pull_request.head.sha || github.sha }} tested=${{ github.sha }} ${totals:-no test summary found}"
          failing=$(grep -E '^ *not ok [0-9]+ - ' check.log 2>/dev/null | sed -E 's/^ *not ok [0-9]+ - //' | cut -c1-200 | head -n 20 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ';' - || true)
          if [ -n "$failing" ]; then echo "::warning title=Failing tests::head=${{ github.event.pull_request.head.sha || github.sha }} ${failing}"; fi
      - name: Build the release bundle
        run: node scripts/release-bundle.mjs dist/release --source-commit "$GITHUB_SHA"
      - name: Verify the bundle against its manifest
        run: node scripts/release-bundle.mjs --verify dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: lilac-release-evidence-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

  desktop:
    # The Desktop workflow itself: each archive is packaged on its own platform's runner,
    # smoke-tested, and taken through the release-candidate journey. It cannot mint OIDC
    # tokens either.
    uses: ./.github/workflows/desktop.yml

  collect:
    # Only downloads and checks finished files; runs no repository or dependency code.
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lilac-release-evidence-${{ github.sha }}
          path: evidence
      # Each archive by its exact name, as desktop.yml uploads it, so no other artifact of
      # this run can stand in for one.
      - uses: actions/download-artifact@v4
        with:
          name: lilac-desktop-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: lilac-desktop-darwin-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: lilac-desktop-win32-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: out
      - name: Check the archives against their package manifests, and list every file
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 darwin-arm64 win32-x64; do
            manifest="out/Lilac-$target.json"
            archive=$(jq -r '.archive' "$manifest")
            expected=$(jq -r '.archiveSha256' "$manifest")
            case "$archive" in "Lilac-$target.tar.gz"|"Lilac-$target.zip") ;; *) echo "::error::$manifest names $archive"; exit 1 ;; esac
            actual=$(sha256sum "out/$archive" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then echo "::error::$archive is $actual, its manifest says $expected"; exit 1; fi
          done
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -C evidence -cf - . | gzip -n > "out/lilac-release-evidence-${{ github.sha }}.tar.gz"
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          count=$(wc -l < out/SHA256SUMS)
          if [ "$count" -ne 7 ]; then echo "::error::expected 7 release files, found $count"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: lilac-release-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 90

  attest:
    # Only downloads the collected files and signs them; runs no repository or dependency code.
    needs: collect
    # Pushed release tags only: a manual dispatch, even one started on a tag, is never signed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lilac-release-evidence-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: lilac-release-${{ github.sha }}
          path: dist/out
      - name: Sign the bundle and the release files (Sigstore build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/**
            dist/out/*

  publish:
    # Puts the signed files in a draft GitHub Release for the pushed tag. It runs only gh,
    # creates no tag (the release must name an existing one) and leaves the draft
    # unpublished: publishing it is the owner's decision.
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lilac-release-${{ github.sha }}
          path: out
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Lilac $TAG" \
            --notes "Desktop archives for Linux x64, macOS arm64 and Windows x64, and the signed evidence bundle for $GITHUB_SHA. Every file carries a Sigstore build-provenance attestation from this repository's release workflow; see docs/RELEASE.md to verify one. Local web mode runs from the tagged source (docs/RELEASE.md)."
