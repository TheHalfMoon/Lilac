name: Release Evidence

# Builds the SBOM and attribution bundle and, for a release tag only, signs it with keyless
# Sigstore attestations through GitHub OIDC (no stored signing key). Pushing a tag is the
# release decision; this workflow never creates tags. A manual dispatch builds and uploads
# the bundle but never signs it, so no attestation exists for anything but a tagged commit.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Dependency and test code runs here, in a job that cannot mint OIDC tokens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build the release bundle
        run: node scripts/release-bundle.mjs dist/release --source-commit "$GITHUB_SHA"
      - name: Verify the bundle against its manifest
        run: node scripts/release-bundle.mjs --verify dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: lilac-release-evidence-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

  attest:
    # Only downloads the finished bundle and signs it; runs no repository or dependency code.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lilac-release-evidence-${{ github.sha }}
          path: dist/release
      - name: Sign the bundle (Sigstore build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/release/**"
