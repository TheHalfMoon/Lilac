name: Public Paper artifact census

on:
  push:
    branches:
      - codex/recover-public-paper-artifacts
    paths:
      - .github/workflows/public-paper-artifact-census.yml
      - scripts/public-paper-artifact-census.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm2cpio cpio libarchive-tools file jq
          npm install --global @electron/asar

      - name: Run public artifact census
        run: python3 scripts/public-paper-artifact-census.py

      - name: Upload metadata-only census
        uses: actions/upload-artifact@v4
        with:
          name: paper-public-artifact-census
          path: paper-census/report
          if-no-files-found: error
          retention-days: 30
