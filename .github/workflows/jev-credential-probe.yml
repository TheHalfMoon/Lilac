name: Jev credential probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  credential-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Check exact pull request identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" != ""
          echo "JEV_PROBE_HEAD=${{ github.event.pull_request.head.sha }}"

      - name: Check Jev credential availability without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JEV_API_KEY:-}" ]]; then
            echo "JEV_CREDENTIAL_SOURCE=JEV_API_KEY"
          elif [[ -n "${TYPESAFE_API_KEY:-}" ]]; then
            echo "JEV_CREDENTIAL_SOURCE=TYPESAFE_API_KEY"
          else
            echo "JEV_CREDENTIAL_SOURCE=NOT_CONFIGURED"
          fi
          echo "JEV_MODEL_CALLS=0"
