name: Paper recovery surface census

on:
  push:
    branches:
      - codex/recover-public-paper-artifacts
    paths:
      - .github/workflows/paper-recovery-surface-census.yml
      - scripts/paper-recovery-surface-census.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file
          npm install --global @electron/asar

      - name: Run recovery surface census
        run: python3 scripts/paper-recovery-surface-census.py

      - name: Upload metadata-only recovery report
        uses: actions/upload-artifact@v4
        with:
          name: paper-recovery-surface-census
          path: paper-recovery-surface/report
          if-no-files-found: error
          retention-days: 30
