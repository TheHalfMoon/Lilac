name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache the pinned Electron archive
        uses: actions/cache@v4
        with:
          path: .ninerr-cache/electron/downloads
          key: electron-${{ runner.os }}-${{ hashFiles('scripts/desktop/electron.mjs') }}
      - name: Fetch the pinned Electron runtime (SHA-256 verified)
        run: node scripts/fetch-electron.mjs
      - name: Allow Chromium's sandbox (unprivileged user namespaces)
        # Ubuntu's AppArmor restricts unprivileged user namespaces, which Chromium's sandbox
        # uses; lift that for this job rather than run the desktop app unsandboxed.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The independence regression gate (N0-G9): the committed census summary must be current,
      # and no tracked file may carry the old product name or a donor's identity outside the
      # narrow, reviewed rules in scripts/identity-policy.json.
      - name: Identity census is current
        run: node scripts/identity-census.mjs --verify
      - name: Identity gate (no unreviewed old or donor identity)
        run: node scripts/identity-census.mjs --check
      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee check.log
      - name: Annotate test totals
        if: always()
        shell: bash
        run: |
          # Check-run annotation readable through the REST API.
          totals=$(grep -E '^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$' check.log 2>/dev/null | sed 's/^# //' | paste -sd ' ' - || true)
          echo "::notice title=Test totals::head=${{ github.event.pull_request.head.sha || github.sha }} tested=${{ github.sha }} ${totals:-no test summary found}"
          # Name the failing tests too, since job logs are not always readable. Annotation
          # text escapes % and CR, and names are joined with ";"; at most 20, each cut to 200 characters.
          failing=$(grep -E '^ *not ok [0-9]+ - ' check.log 2>/dev/null | sed -E 's/^ *not ok [0-9]+ - //' | cut -c1-200 | head -n 20 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ';' - || true)
          if [ -n "$failing" ]; then
            echo "::warning title=Failing tests::head=${{ github.event.pull_request.head.sha || github.sha }} ${failing}"
            # And the first line of each failure's error (at most 10, each cut to 300 characters).
            reasons=$(awk '/^ *not ok [0-9]+ - /{want=1; next} want && /^ +error: /{sub(/^ +error: /, ""); line=$0; if (line ~ /^[|>]-?$/) {getline; sub(/^ +/, ""); line=$0} print substr(line, 1, 300); want=0}' check.log | head -n 10 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ';' - || true)
            if [ -n "$reasons" ]; then
              echo "::warning title=Failure reasons::head=${{ github.event.pull_request.head.sha || github.sha }} ${reasons}"
            fi
          fi
