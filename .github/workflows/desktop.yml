name: Desktop

# PC gates 15 and 17: package the Ninerr desktop app on each supported platform's own
# runner, smoke-test the packaged app, and run the release-candidate journey and the
# resilience journey through it (scripts/package-desktop.mjs, scripts/smoke-desktop.mjs,
# scripts/journey-desktop.mjs, scripts/resilience-desktop.mjs).
# The release workflow calls it too (P07d), so a release's archives are built and tested
# exactly as every pull request's are.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Desktop package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check the runner
        shell: bash
        run: |
          set -euo pipefail
          actual=$(node -p 'process.platform + "-" + process.arch')
          if [ "$actual" != "${{ matrix.target }}" ]; then echo "::error::runner is $actual, not ${{ matrix.target }}"; exit 1; fi
      - name: Cache the pinned Electron archive
        uses: actions/cache@v4
        with:
          path: .ninerr-cache/electron/downloads
          key: electron-${{ matrix.target }}-${{ hashFiles('scripts/desktop/electron.mjs') }}
      - name: Allow Chromium's sandbox (unprivileged user namespaces)
        if: runner.os == 'Linux'
        # As in CI: lift Ubuntu's AppArmor restriction rather than run unsandboxed.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Package
        id: package
        shell: bash
        run: |
          set -uo pipefail
          node scripts/package-desktop.mjs --out dist/desktop 2>&1 | tee package.log
          exit "${PIPESTATUS[0]}"
      - name: Smoke-test the packaged app
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          # The step runs under bash -e: pick the archive by testing, not with a failing ls.
          archive=""
          for candidate in dist/desktop/Ninerr-${{ matrix.target }}.tar.gz dist/desktop/Ninerr-${{ matrix.target }}.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; fi
          done
          echo "archive: [$archive]" > smoke.err
          node scripts/smoke-desktop.mjs "$archive" 2>>smoke.err | tee smoke.json
          exit "${PIPESTATUS[0]}"
      - name: Release-candidate journey through the packaged app
        id: journey
        shell: bash
        run: |
          set -uo pipefail
          archive=""
          for candidate in dist/desktop/Ninerr-${{ matrix.target }}.tar.gz dist/desktop/Ninerr-${{ matrix.target }}.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; fi
          done
          node scripts/journey-desktop.mjs "$archive" 2>journey.err | tee journey.json
          exit "${PIPESTATUS[0]}"
      - name: Resilience journey through the packaged app
        id: resilience
        # Run even when the journey failed (what a crash does is separate evidence), but only
        # with a package to run.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          archive=""
          for candidate in dist/desktop/Ninerr-${{ matrix.target }}.tar.gz dist/desktop/Ninerr-${{ matrix.target }}.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; fi
          done
          node scripts/resilience-desktop.mjs "$archive" 2>resilience.err | tee resilience.json
          exit "${PIPESTATUS[0]}"
      - name: Annotate the evidence
        if: always()
        shell: bash
        run: |
          # Check-run annotations readable through the REST API.
          node - "${{ github.event.pull_request.head.sha || github.sha }}" <<'NODE'
          const fs = require("node:fs");
          const head = process.argv[2];
          const escape = (value) => String(value).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          // The manifest is one JSON document; the smoke result is its output's last line.
          const read = (path, lastLine = false) => {
            try {
              const text = fs.readFileSync(path, "utf8").trim();
              return JSON.parse(lastLine ? text.split("\n").at(-1) : text);
            } catch {
              return null;
            }
          };
          const manifest = read("dist/desktop/Ninerr-${{ matrix.target }}.json");
          const smoke = read("smoke.json", true);
          const journey = read("journey.json", true);
          const resilience = read("resilience.json", true);
          const outcome = (result) => {
            if (result === null) return "not run";
            return result.ok ? "ok" : "failed";
          };
          const fuses = manifest ? Object.entries(manifest.fuses).map(([name, on]) => `${name}=${on === "removed" ? "r" : on ? 1 : 0}`).join(",") : "none";
          console.log(`::notice title=Desktop package evidence::${escape([
            `head=${head}`,
            `target=${{ matrix.target }}`,
            `archive=${manifest?.archive ?? "none"}`,
            `archive_sha256=${manifest?.archiveSha256 ?? "none"}`,
            `app_sha256=${manifest?.appSha256 ?? "none"}`,
            `electron=${manifest?.electron ?? "none"}`,
            `signed=${manifest?.signed ?? "none"}`,
            `fuses=${fuses}`,
            `smoke=${smoke === null ? "not run" : smoke.ok ? "ok" : "failed"}`,
            `checks=${smoke === null ? 0 : smoke.checks.filter((item) => item.ok).length}/${smoke === null ? 0 : smoke.checks.length}`,
          ].join("; "))}`);
          if (smoke !== null && !smoke.ok) console.log(`::error title=Desktop smoke failure::${escape(`head=${head} target=${{ matrix.target }} ${smoke.error}`)}`);
          console.log(`::notice title=Release-candidate journey evidence::${escape([
            `head=${head}`,
            `target=${{ matrix.target }}`,
            `journey=${journey === null ? "not run" : journey.ok ? "ok" : "failed"}`,
            `steps=${journey === null ? 0 : journey.steps.filter((item) => item.ok).length}/${journey?.total ?? 0}`,
          ].join("; "))}`);
          if (journey !== null && !journey.ok) console.log(`::error title=Release-candidate journey failure::${escape(`head=${head} target=${{ matrix.target }} ${journey.error}`)}`);
          console.log(`::notice title=Desktop resilience evidence::${escape([
            `head=${head}`,
            `target=${{ matrix.target }}`,
            `resilience=${outcome(resilience)}`,
            `steps=${resilience === null ? 0 : resilience.steps.filter((item) => item.ok).length}/${resilience?.total ?? 0}`,
          ].join("; "))}`);
          if (resilience !== null && !resilience.ok) console.log(`::error title=Desktop resilience failure::${escape(`head=${head} target=${{ matrix.target }} ${resilience.error}`)}`);
          // Job logs are not always readable: the end of a failed step's output, as an annotation.
          for (const [file, title] of [["package.log", "Desktop package output"], ["smoke.err", "Desktop smoke errors"], ["journey.err", "Release-candidate journey errors"], ["resilience.err", "Desktop resilience errors"]]) {
            if ((manifest !== null && file === "package.log") || (file === "smoke.err" && smoke?.ok) || (file === "journey.err" && journey?.ok) || (file === "resilience.err" && resilience?.ok)) continue;
            try {
              const text = fs.readFileSync(file, "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              console.log(`::warning title=${title}::${escape(`head=${head} target=${{ matrix.target }} ${text.slice(-900)}`)}`);
            } catch {}
          }
          NODE
      - name: Upload the package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninerr-desktop-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/desktop/Ninerr-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7
