name: Bug report
description: Something in Ninerr does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. SECURITY.md describes how to report one privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps, or a project, that shows the problem.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Editor in a browser (npm start)
        - Desktop app
        - MCP server
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse HEAD`, or the desktop archive's name.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and the Node.js version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the terminal or the console. Remove any tokens.
      render: text
