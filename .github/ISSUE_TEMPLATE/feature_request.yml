name: Feature request
description: A change to what Ninerr does.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The change you have in mind, and the alternatives you considered.
    validations:
      required: true
